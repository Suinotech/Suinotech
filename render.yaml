services:
  - type: web
    name: suinotech
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: DATABASE_PATH
        value: /tmp/suinotech.db
version: "1"
