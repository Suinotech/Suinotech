services:
  - type: web
    name: suinotech
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT
    autoDeploy: true
    envVars:
      - key: DATABASE_PATH
        value: /var/data/suinotech.db
    disk:
      name: suinotech-data
      mountPath: /var/data
      sizeGB: 1
version: "1"
