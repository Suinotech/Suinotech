{% extends "base.html" %}

{% block title %}Nova Ração - SuinoTech{% endblock %}

{% block content %}
<div class="card">
    <h2>🌾 Nova Ração</h2>
    <form method="POST">
        <div class="form-group">
            <label>Nome *</label>
            <input type="text" class="form-control" name="nome" required>
        </div>
        <div class="form-group">
            <label>Fase de Aplicação</label>
            <select class="form-control" name="fase_aplicacao">
                <option value="">Selecione</option>
                <option value="Matrizes">Matrizes</option>
                <option value="Creche">Creche</option>
                <option value="Recria">Recria</option>
                <option value="Terminação">Terminação</option>
            </select>
        </div>
        <div class="form-group">
            <label>Tipo</label>
            <input type="text" class="form-control" name="tipo">
        </div>
        <div class="grid" style="grid-template-columns: repeat(2, 1fr);">
            <div class="form-group">
                <label>Quantidade Total</label>
                <input type="number" step="0.01" class="form-control" name="quantidade_total">
            </div>
            <div class="form-group">
                <label>Unidade</label>
                <select class="form-control" name="unidade">
                    <option value="kg">kg</option>
                    <option value="ton">ton</option>
                    <option value="saco">saco</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>Data de Validade</label>
            <input type="date" class="form-control" name="data_validade">
        </div>
        <div class="form-group">
            <label>Fornecedor</label>
            <input type="text" class="form-control" name="fornecedor">
        </div>
        <div class="form-group">
            <label>Preço por Kg (R$)</label>
            <input type="number" step="0.01" class="form-control" name="preco_kg">
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <a href="{{ url_for('racao') }}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
    </form>
</div>
{% endblock %}
