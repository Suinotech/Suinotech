{% extends "base.html" %}

{% block title %}Novo Registro de Saúde - SuinoTech{% endblock %}

{% block content %}
<div class="card">
    <h2>💊 Novo Registro de Saúde</h2>
    <form method="POST">
        <div class="form-group">
            <label>Animal</label>
            <small style="display: block; color: #718096; margin-bottom: 6px;">Selecione um suíno OU uma matriz</small>
        </div>
        <div class="grid" style="grid-template-columns: repeat(2, 1fr);">
            <div class="form-group">
                <label>Suíno</label>
                <select class="form-control" name="suino_id">
                    <option value="">Selecione</option>
                    {% for suino in suinos %}
                    <option value="{{ suino.id }}">{{ suino.identificacao }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Matriz</label>
                <select class="form-control" name="matriz_id">
                    <option value="">Selecione</option>
                    {% for matriz in matrizes %}
                    <option value="{{ matriz.id }}">{{ matriz.identificacao }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>Tipo *</label>
            <select class="form-control" name="tipo" required>
                <option value="">Selecione</option>
                <option value="Vacinação">Vacinação</option>
                <option value="Tratamento">Tratamento</option>
                <option value="Consulta">Consulta</option>
                <option value="Desparasitação">Desparasitação</option>
            </select>
        </div>
        <div class="form-group">
            <label>Produto</label>
            <input type="text" class="form-control" name="produto">
        </div>
        <div class="form-group">
            <label>Dosagem</label>
            <input type="text" class="form-control" name="dosagem">
        </div>
        <div class="form-group">
            <label>Descrição</label>
            <textarea class="form-control" name="descricao" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label>Veterinário</label>
            <input type="text" class="form-control" name="veterinario">
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <a href="{{ url_for('saude') }}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
    </form>
</div>
{% endblock %}
